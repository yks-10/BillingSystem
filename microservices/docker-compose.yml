version: '3.8'

services:
  # PostgreSQL databases
  product-db:
    image: postgres:15-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:15-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  denomination-db:
    image: postgres:15-alpine
    container_name: denomination-db
    environment:
      POSTGRES_DB: denomination_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - denomination-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: product-service
    environment:
      SERVICE_NAME: product-service
      SERVICE_PORT: 8001
      DATABASE_URL: postgresql://postgres:postgres@product-db:5432/product_db
      PRODUCT_SERVICE_URL: http://product-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      DENOMINATION_SERVICE_URL: http://denomination-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    ports:
      - "8001:8001"
    depends_on:
      product-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      SERVICE_NAME: order-service
      SERVICE_PORT: 8002
      DATABASE_URL: postgresql://postgres:postgres@order-db:5432/order_db
      PRODUCT_SERVICE_URL: http://product-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      DENOMINATION_SERVICE_URL: http://denomination-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    ports:
      - "8002:8002"
    depends_on:
      order-db:
        condition: service_healthy
      product-service:
        condition: service_healthy
      denomination-service:
        condition: service_healthy
      notification-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  denomination-service:
    build:
      context: .
      dockerfile: denomination-service/Dockerfile
    container_name: denomination-service
    environment:
      SERVICE_NAME: denomination-service
      SERVICE_PORT: 8003
      DATABASE_URL: postgresql://postgres:postgres@denomination-db:5432/denomination_db
      PRODUCT_SERVICE_URL: http://product-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      DENOMINATION_SERVICE_URL: http://denomination-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    ports:
      - "8003:8003"
    depends_on:
      denomination-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    environment:
      SERVICE_NAME: notification-service
      SERVICE_PORT: 8004
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      PRODUCT_SERVICE_URL: http://product-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      DENOMINATION_SERVICE_URL: http://denomination-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      SERVICE_NAME: api-gateway
      SERVICE_PORT: 8000
      PRODUCT_SERVICE_URL: http://product-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
      DENOMINATION_SERVICE_URL: http://denomination-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
    ports:
      - "8000:8000"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      denomination-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  product-db-data:
  order-db-data:
  denomination-db-data:

networks:
  default:
    name: billing-microservices
